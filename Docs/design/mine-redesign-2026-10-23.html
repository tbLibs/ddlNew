<main class="board">
<header class="intro"><div><div class="eyebrow">DDLNEW / MINE REDESIGN</div><h1>我的，回归清晰与从容。</h1><p>真实身份放在第一眼。活动、俱乐部与账户服务各归其位，延续熟悉的森林绿。</p></div><div class="stamp"><strong>推荐方案 A · 自然留白</strong><br>iOS 16+ · 2026.10.23<br>设计审阅稿 / 尚未实施</div></header>
<div class="bar"><div class="filters" aria-label="设计稿视图"><button type="button" aria-pressed="true" data-filter="all">全部对照</button><button type="button" aria-pressed="false" data-filter="light">浅色</button><button type="button" aria-pressed="false" data-filter="dark">深色</button><button type="button" aria-pressed="false" data-filter="large">窄屏 · 大字号</button></div><div class="preview-note">昵称、账号和头像均为预览示例，俱乐部为现有本地演示内容。<br>每张手机内可滚动查看完整页面；按钮仅演示入口说明。</div></div>
<div class="gallery" id="gallery"></div>
<footer class="review-footer"><p><b>身份 → 活动 → 俱乐部 → 账户服务</b><br>四种记录全部保留，不用虚构统计撑满页面。二维码与复制账号复用现有能力。</p><p>保留原生导航、设置与四栏 Tab。<br><a href="mine-redesign-2026-10-23.md">阅读方案比较与实施规格 →</a></p></footer>
</main><div class="feedback" role="status" aria-live="polite" aria-atomic="true" id="feedback"></div>
<script>
const icon=(id,extra='')=>`<svg class="icon ${extra}" aria-hidden="true"><use href="#${id}"/></svg>`;
const records=[['calendar','我的报名'],['clock','候补记录'],['check','签到记录'],['flag','已参加活动']];
const menus=[['block','黑名单'],['support','投诉与支持']];
const descriptions={ '复制账号':'预览：复制当前登录账号，并显示“账号已复制”。本设计稿未读取或修改剪贴板。','我的二维码':'预览：进入现有“我的二维码”页面，继续使用真实 SDK 生成的内容。','设置':'预览：打开现有设置页，保留退出登录与注销入口。','我的报名':'预览：进入“我的报名”记录列表。','候补记录':'预览：进入“候补记录”列表。','签到记录':'预览：进入“签到记录”列表。','已参加活动':'预览：进入“已参加活动”列表。','当前俱乐部':'预览：进入现有俱乐部页；目前俱乐部内容仍为本地演示。','更换俱乐部':'预览：先显示原有确认框；确认后退出当前空间并返回邀请码页。','黑名单':'预览：进入现有真实黑名单页面。','投诉与支持':'预览：进入现有系统投诉表单。','首页':'预览：切换至首页。','消息':'预览：切换至消息。','通讯录':'预览：切换至通讯录。','我的':'当前页面为“我的”。'};
const modes=[{id:'light',title:'01 / 日间',size:'390 pt · 默认字号',className:'',caption:'<b>身份独立呈现。</b> 72 pt 头像、可复制账号与轻量二维码入口。活动采用两列，减少连续列表的查找成本。'},{id:'dark',title:'02 / 夜间',size:'390 pt · 深色模式',className:'dark',caption:'<b>同一层级，独立配色。</b> 深绿表面与浅绿强调保持自然感，边界通过细描边区分，避免叠加厚重阴影。'},{id:'large',title:'03 / 易读',size:'375 pt · 大字号示意',className:'large',caption:'<b>字变大，布局跟着变。</b> 身份改纵向，四类活动改为单列。长昵称、账号和俱乐部名自然换行，滚动查看全部内容。'}];
for(const mode of modes){const large=mode.id==='large'; const article=document.createElement('article');article.className='artboard'+(large?' narrow':'');article.dataset.mode=mode.id;article.innerHTML=`<div class="art-title"><h2>${mode.title}</h2><span>${mode.size}</span></div><div class="phone ${mode.className}"><div class="status" aria-hidden="true"><span>9:41</span><div class="island"></div><div class="status-icons"><svg><use href="#signal"/></svg><svg><use href="#wifi"/></svg><span class="battery"></span></div></div><div class="nav"><span></span><strong>我的</strong><button class="icon-button" aria-label="打开设置" data-action="设置">${icon('settings')}</button></div><div class="scroll" tabindex="0" role="region" aria-label="${mode.title} 我的页面，可滚动"><div class="profile"><div class="avatar" aria-hidden="true">${icon('person')}</div><div class="identity"><h3 class="name">${large?'这是一个比较长的昵称示例':'昵称示例'}</h3><div class="account"><span>账号：${large?'account_demo_2026':'account_demo'}</span><button class="icon-button" aria-label="复制账号" data-action="复制账号">${icon('copy')}</button></div><button class="qr-link" data-action="我的二维码">${icon('qr')}<span>我的二维码</span>${icon('chevron','chevron')}</button></div></div><div class="content"><section class="section"><h4 class="section-heading">我的活动</h4><div class="records">${records.map(([i,n])=>`<button class="record" data-action="${n}"><span class="tile-icon">${icon(i)}</span><span>${n}</span></button>`).join('')}</div></section><section class="section"><h4 class="section-heading">俱乐部</h4><div class="club"><button class="club-main" data-action="当前俱乐部"><span class="club-mark">${icon('mountain')}</span><span class="club-copy"><strong>远山户外${large?' · 周末徒步与自然探索':''}</strong><small>当前俱乐部</small></span>${icon('chevron','chevron')}</button><div class="club-switch"><button data-action="更换俱乐部"><span>更换俱乐部</span>${icon('chevron','chevron')}</button></div></div></section><section class="section"><h4 class="section-heading">账户与支持</h4><div class="menu">${menus.map(([i,n])=>`<button class="menu-row" data-action="${n}">${icon(i)}<span class="label">${n}</span>${icon('chevron','chevron')}</button>`).join('')}</div></section></div></div><div class="tabs" role="navigation" aria-label="主导航">${[['home','首页'],['chat','消息'],['contacts','通讯录'],['person','我的']].map(([i,n])=>`<button class="tab ${n==='我的'?'active':''}" ${n==='我的'?'aria-current="page"':''} data-action="${n}">${icon(i)}<span>${n}</span></button>`).join('')}<div class="home-indicator" aria-hidden="true"></div></div></div><p class="caption">${mode.caption}</p>`;document.querySelector('#gallery').append(article);}
let timer;document.addEventListener('click',event=>{const filter=event.target.closest('[data-filter]');if(filter){const selected=filter.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));document.querySelectorAll('.artboard').forEach(a=>a.hidden=selected!=='all'&&a.dataset.mode!==selected);document.querySelector('.gallery').classList.toggle('single',selected!=='all');return;}const button=event.target.closest('[data-action]');if(button){clearTimeout(timer);document.querySelector('#feedback').textContent=descriptions[button.dataset.action];timer=setTimeout(()=>document.querySelector('#feedback').textContent='',5000);}});
</script></body></html>
