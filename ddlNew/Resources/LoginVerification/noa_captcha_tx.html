<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Security verification</title>
<!-- 由旧项目 CandyTalk 验证码资源适配，沿用服务商标识与 SDK 地址。 -->
<script>
const appCaptchaLanguage = (window.appCaptchaLocalization || {}).language || 'en';
document.documentElement.lang = appCaptchaLanguage;
document.title = (window.appCaptchaLocalization || {}).title || 'Security verification';
function reportCaptchaState(state) {
  if (window.webkit && window.webkit.messageHandlers.captchaStatus) {
    window.webkit.messageHandlers.captchaStatus.postMessage(JSON.stringify({state: state}));
  }
}
</script>
<style>html,body{background:transparent;margin:0;padding:0;height:100%;}#captcha-element{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);}</style>
<script src="https://ca.turing.captcha.qcloud.com/TCaptcha-global.js" onerror="reportCaptchaState('failed')"></script>
</head>
<body>
<script>
// 仅转交腾讯 SDK 的真实回调，由原生侧检查成功状态和验证凭据。
function globalCallback(res) {
  if (window.webkit && window.webkit.messageHandlers.iosJSBridge) {
    window.webkit.messageHandlers.iosJSBridge.postMessage(JSON.stringify(res));
  }
}
window.onload = function () {
  try {
    const captcha = new TencentCaptcha('189974576', globalCallback, {
      userLanguage: ({'zh-Hans': 'zh-cn', 'zh-Hant': 'zh-tw', 'en': 'en'})[appCaptchaLanguage] || 'en',
      needFeedBack: false,
      enableDarkMode: false,
      loading: false,
      ready: function () { reportCaptchaState('ready'); }
    });
    captcha.show();
  } catch (error) { reportCaptchaState('failed'); }
};
</script>
</body>
</html>
